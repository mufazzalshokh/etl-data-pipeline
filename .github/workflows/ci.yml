name: ETL Pipeline CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  POSTGRES_DB: test_etl
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  OPEN_EXCHANGE_RATES_APP_ID: test_key  # mocked in tests

jobs:
  # Job 1: Python lint + unit tests

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-mock

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 extractors/ dags/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Enforce style (max line length 100 for readability)
          flake8 extractors/ dags/ --count --max-line-length=100 --statistics

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  
  # Job 2: dbt model compilation + tests
  
  dbt-tests:
    name: dbt Tests
    runs-on: ubuntu-latest
    needs: python-tests   # only run if Python tests pass

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_etl
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_etl"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: |
          pip install dbt-core==1.7.10 dbt-postgres==1.7.10

      - name: Initialise database schemas
        run: |
          PGPASSWORD=test_password psql -h localhost -U test_user -d test_etl -f scripts/init_db.sql

      - name: dbt debug (validate connection)
        working-directory: dbt_project
        run: dbt debug --profiles-dir . --project-dir .
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_etl

      - name: dbt compile (validate all SQL)
        working-directory: dbt_project
        run: dbt compile --profiles-dir . --project-dir .
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_etl

      - name: Seed test data
        working-directory: dbt_project
        run: dbt seed --profiles-dir . --project-dir . || true
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_etl

      - name: dbt run (build all models)
        working-directory: dbt_project
        run: dbt run --profiles-dir . --project-dir .
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_etl

      - name: dbt test (data quality checks)
        working-directory: dbt_project
        run: dbt test --profiles-dir . --project-dir .
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_etl

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: dbt_project/target/
          retention-days: 7
